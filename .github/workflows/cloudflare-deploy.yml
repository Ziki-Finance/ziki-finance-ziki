name: Deploy (Cloudflare Workers)

on:
  push:
    branches: [ops/cloudflare-deploy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Build-time only. The live Worker reads its real secrets from Cloudflare.
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          AUTH_SECRET: "ci-build-secret-dummy-must-be-long-enough-32-chars"
          NEXTAUTH_URL: https://ziki-finance.ibuild-ai.workers.dev/api/auth
          # Wrangler requires a local address for the HYPERDRIVE binding during deploy.
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: "postgresql://dummy:dummy@localhost:5432/dummy"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: pnpm cf:deploy
