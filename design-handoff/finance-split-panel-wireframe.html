<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ziki Finance — Layout Comparison</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased p-4 sm:p-6">
  <div class="mx-auto max-w-7xl space-y-5">
    <!-- Top Switcher Bar -->
    <div class="flex flex-col gap-3 rounded-xl border border-[var(--border)] bg-[var(--card)] p-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h1 class="text-base font-bold text-[var(--foreground)]">
          Finance Layout Preview: Proposed vs. Current
        </h1>
        <p class="mt-0.5 text-xs text-[var(--muted-foreground)]">
          Click any company row to open the split-screen side panel, toggle Criteria, or click <strong>Buy</strong> on a recommendation to see it move into <strong>Owned</strong>.
        </p>
      </div>
      <div class="inline-flex rounded-lg border border-[var(--border)] bg-[var(--background)] p-1">
        <button
          id="tab-proposed"
          type="button"
          onclick="setMode('proposed')"
          class="rounded-md px-3 py-1.5 text-xs font-semibold transition"
        >
          Proposed (List + Split Panel)
        </button>
        <button
          id="tab-current"
          type="button"
          onclick="setMode('current')"
          class="rounded-md px-3 py-1.5 text-xs font-semibold transition"
        >
          Current (How It Works Now)
        </button>
      </div>
    </div>

    <!-- Main Interactive Stage -->
    <div id="stage"></div>
  </div>

  <script>
    const INITIAL_STOCKS = [
      {
        id: "aapl",
        symbol: "AAPL",
        name: "Apple",
        owned: true,
        price: "$228.50",
        verdict: "Keep",
        thesisHealth: "Holds",
        shares: 20,
        avgCost: "$200.10",
        positionValue: "$4,570",
        gainPct: "+14.2%",
        gainPositive: true,
        buyRange: "$195 – $215",
        score: "5/5 Go",
        stage: "Decide",
        summary: "Services margin expansion and ecosystem lock-in remain intact.",
        reasons: [
          "Services revenue grew 14% YoY with >70% gross margin",
          "Net cash neutral trajectory with steady buybacks",
          "Installed base >2.2B active devices"
        ],
        risks: [
          "China smartphone share pressure",
          "App Store regulatory fee compression in EU"
        ]
      },
      {
        id: "nvda",
        symbol: "NVDA",
        name: "NVIDIA",
        owned: true,
        price: "$138.40",
        verdict: "Keep",
        thesisHealth: "Weakening",
        shares: 35,
        avgCost: "$112.00",
        positionValue: "$4,844",
        gainPct: "+23.6%",
        gainPositive: true,
        buyRange: "$105 – $125",
        score: "4/5 Go",
        stage: "Decide",
        summary: "Blackwell demand strong, but hyperscaler capex concentration rising.",
        reasons: [
          "CUDA software moat sustains >70% data-center gross margins",
          "12-month Blackwell backlog visibility"
        ],
        risks: [
          "Top 4 customers represent >45% of data-center revenue",
          "Custom silicon (TPU/Trainium) competition"
        ]
      },
      {
        id: "msft",
        symbol: "MSFT",
        name: "Microsoft",
        owned: false,
        price: "$418.20",
        verdict: "Go",
        thesisHealth: null,
        shares: 0,
        avgCost: null,
        positionValue: null,
        gainPct: null,
        gainPositive: true,
        buyRange: "$395 – $435",
        score: "4/5 Go",
        stage: "Decide",
        summary: "Durable enterprise cloud moat, 35% ROIC, and disciplined capital return.",
        reasons: [
          "Azure + M365 switching costs with >42% operating margin",
          "Free cash flow margin above 30%"
        ],
        risks: [
          "$80B+ annual AI capex may pressure near-term FCF"
        ]
      },
      {
        id: "cost",
        symbol: "COST",
        name: "Costco",
        owned: false,
        price: "$912.00",
        verdict: "In review",
        thesisHealth: null,
        shares: 0,
        avgCost: null,
        positionValue: null,
        gainPct: null,
        gainPositive: true,
        buyRange: "$780 – $840",
        score: "In review",
        stage: "Evaluate",
        summary: "93% membership renewal rate, though valuation is stretched above 50x.",
        reasons: [
          "Membership fee increases flow straight to operating income",
          "Consistent international warehouse expansion"
        ],
        risks: [
          "Trading >50x forward earnings leaves slim margin of safety"
        ]
      },
      {
        id: "googl",
        symbol: "GOOGL",
        name: "Alphabet",
        owned: false,
        price: "$174.60",
        verdict: "No-go",
        thesisHealth: null,
        shares: 0,
        avgCost: null,
        positionValue: null,
        gainPct: null,
        gainPositive: false,
        buyRange: "$150 – $165",
        score: "2/5 Go",
        stage: "Done",
        summary: "Search monetization resilient, but antitrust remedies create overhang.",
        reasons: [
          "Google Cloud operating margins crossed 17%"
        ],
        risks: [
          "DOJ search distribution ruling creates structural uncertainty"
        ]
      }
    ];

    const CRITERIA_LIST = [
      { id: "c1", name: "Quality at a fair price", version: "v2", active: true, summary: "ROIC > 20%, net debt/EBITDA < 2x, durable moat." },
      { id: "c2", name: "Steady dividend growers", version: "v1", active: false, summary: "10+ years dividend growth, payout ratio < 60%." }
    ];

    let state = {
      mode: "proposed", // "proposed" | "current"
      stocks: JSON.parse(JSON.stringify(INITIAL_STOCKS)),
      selectedId: "msft",
      sideMode: "company", // "company" | "criteria" | null
      pipelineTab: "decide",
      search: "",
      currentCriteriaOpen: true,
      currentBanner: null
    };

    function setMode(mode) {
      state.mode = mode;
      state.currentBanner = null;
      render();
    }

    function selectStock(id) {
      if (state.mode === "current") {
        const s = state.stocks.find(x => x.id === id);
        state.currentBanner = `Currently: clicking "${s.name} (${s.symbol})" navigates away to /finance/${s.symbol} (full page reload).`;
        render();
        return;
      }
      state.selectedId = id;
      state.sideMode = "company";
      render();
    }

    function toggleCriteria() {
      if (state.mode === "current") {
        state.currentCriteriaOpen = !state.currentCriteriaOpen;
        render();
        return;
      }
      state.sideMode = state.sideMode === "criteria" ? null : "criteria";
      render();
    }

    function closeSidePanel() {
      state.sideMode = null;
      render();
    }

    function buyStock(event, id) {
      event.stopPropagation();
      const s = state.stocks.find(x => x.id === id);
      if (!s) return;
      s.owned = true;
      s.verdict = "Keep";
      s.thesisHealth = "Holds";
      s.shares = 10;
      s.avgCost = s.price;
      const numeric = parseFloat(s.price.replace(/[^0-9.]/g, "")) * 10;
      s.positionValue = "$" + numeric.toLocaleString("en-US", { maximumFractionDigits: 0 });
      s.gainPct = "0.0%";
      s.gainPositive = true;
      state.selectedId = id;
      state.sideMode = "company";
      render();
    }

    function resetDemo() {
      state.stocks = JSON.parse(JSON.stringify(INITIAL_STOCKS));
      state.selectedId = "msft";
      state.sideMode = "company";
      render();
    }

    function badgeStyle(label) {
      if (["Go", "Keep", "Holds"].includes(label)) {
        return "border-[var(--success)]/40 bg-[var(--success)]/15 text-[var(--success)]";
      }
      if (["Weakening", "In review", "Trim"].includes(label)) {
        return "border-[var(--warning)]/40 bg-[var(--warning)]/15 text-[var(--warning)]";
      }
      if (["No-go", "Sell", "Broken"].includes(label)) {
        return "border-[var(--error)]/40 bg-[var(--error)]/15 text-[var(--error)]";
      }
      return "border-[var(--border)] bg-[var(--content)] text-[var(--muted-foreground)]";
    }

    function renderCriteriaPanel() {
      return `
        <aside class="rounded-xl border border-[var(--card-border)] bg-[var(--card)] p-4 space-y-4">
          <div class="flex items-center justify-between border-b border-[var(--border)] pb-3">
            <div>
              <h3 class="text-sm font-bold text-[var(--foreground)]">Research Criteria</h3>
              <p class="text-xs text-[var(--muted-foreground)]">Active strategy guiding agent screening</p>
            </div>
            <button type="button" onclick="closeSidePanel()" class="rounded-md border border-[var(--border)] px-2 py-1 text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)]">✕</button>
          </div>
          <div class="space-y-2.5">
            ${CRITERIA_LIST.map(c => `
              <div class="rounded-lg border ${c.active ? "border-[var(--primary)] bg-[var(--primary)]/5" : "border-[var(--border)] bg-[var(--background)]"} p-3 space-y-1">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-xs font-semibold text-[var(--foreground)]">${c.name}</span>
                  <span class="rounded border border-[var(--border)] px-1.5 py-0.5 text-xs text-[var(--muted-foreground)]">${c.version}</span>
                </div>
                <p class="text-xs text-[var(--muted-foreground)]">${c.summary}</p>
              </div>
            `).join("")}
          </div>
          <button type="button" class="w-full rounded-lg bg-[var(--primary)] px-3 py-2 text-xs font-semibold text-[var(--primary-foreground)]">
            + New criteria
          </button>
        </aside>
      `;
    }

    function renderCompanySidePanel(stock) {
      if (!stock) return "";
      const stages = ["screen", "enrich", "evaluate", "decide"];
      return `
        <aside class="rounded-xl border border-[var(--card-border)] bg-[var(--card)] p-4 space-y-4">
          <div class="flex items-start justify-between gap-3 border-b border-[var(--border)] pb-3">
            <div class="flex items-center gap-3">
              <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-[var(--border)] bg-[var(--background)] text-xs font-bold text-[var(--primary)]">
                ${stock.symbol.slice(0, 2)}
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="text-sm font-bold text-[var(--foreground)]">${stock.name}</h3>
                  <span class="font-mono text-xs text-[var(--muted-foreground)]">${stock.symbol}</span>
                  ${stock.owned ? `<span class="rounded-full border border-[var(--primary)]/40 bg-[var(--primary)]/10 px-2 py-0.5 text-xs font-medium text-[var(--primary)]">Owned</span>` : ""}
                </div>
                <p class="text-xs text-[var(--muted-foreground)]">Price: <strong class="text-[var(--foreground)]">${stock.price}</strong></p>
              </div>
            </div>
            <button type="button" onclick="closeSidePanel()" class="rounded-md border border-[var(--border)] px-2 py-1 text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)]">✕</button>
          </div>

          ${stock.owned ? `
            <div class="grid grid-cols-3 gap-2 rounded-lg border border-[var(--border)] bg-[var(--background)] p-3">
              <div>
                <p class="text-xs text-[var(--muted-foreground)]">Position</p>
                <p class="text-xs font-bold tabular-nums text-[var(--foreground)]">${stock.positionValue}</p>
                <p class="text-xs text-[var(--muted-foreground)]">${stock.shares} sh @ ${stock.avgCost}</p>
              </div>
              <div>
                <p class="text-xs text-[var(--muted-foreground)]">Return</p>
                <p class="text-xs font-bold tabular-nums text-[var(--success)]">${stock.gainPct}</p>
              </div>
              <div>
                <p class="text-xs text-[var(--muted-foreground)]">Thesis</p>
                <span class="mt-0.5 inline-block rounded border px-1.5 py-0.5 text-xs font-medium ${badgeStyle(stock.thesisHealth)}">${stock.thesisHealth}</span>
              </div>
            </div>
          ` : `
            <div class="grid grid-cols-3 gap-2 rounded-lg border border-[var(--border)] bg-[var(--background)] p-3">
              <div>
                <p class="text-xs text-[var(--muted-foreground)]">Verdict</p>
                <span class="mt-0.5 inline-block rounded border px-1.5 py-0.5 text-xs font-medium ${badgeStyle(stock.verdict)}">${stock.verdict}</span>
              </div>
              <div>
                <p class="text-xs text-[var(--muted-foreground)]">Buy range</p>
                <p class="text-xs font-bold tabular-nums text-[var(--foreground)]">${stock.buyRange}</p>
              </div>
              <div>
                <p class="text-xs text-[var(--muted-foreground)]">Review</p>
                <p class="text-xs font-bold tabular-nums text-[var(--foreground)]">${stock.score}</p>
              </div>
            </div>
          `}

          <!-- 4-Stage Pipeline Tabs -->
          <div class="grid grid-cols-4 gap-1 rounded-lg border border-[var(--border)] bg-[var(--background)] p-1">
            ${stages.map(st => `
              <button
                type="button"
                onclick="state.pipelineTab='${st}'; render();"
                class="rounded px-2 py-1 text-xs font-medium capitalize transition ${state.pipelineTab === st ? "bg-[var(--card)] text-[var(--foreground)] shadow-sm" : "text-[var(--muted-foreground)]"}"
              >
                ${st}
              </button>
            `).join("")}
          </div>

          <div class="space-y-3 text-xs">
            <p class="text-[var(--foreground)] leading-relaxed">${stock.summary}</p>
            <div class="space-y-1.5">
              <p class="font-semibold text-[var(--foreground)]">Key Reasons</p>
              <ul class="space-y-1 text-[var(--muted-foreground)] list-disc pl-4">
                ${stock.reasons.map(r => `<li>${r}</li>`).join("")}
              </ul>
            </div>
            <div class="space-y-1.5">
              <p class="font-semibold text-[var(--foreground)]">Key Risks</p>
              <ul class="space-y-1 text-[var(--muted-foreground)] list-disc pl-4">
                ${stock.risks.map(r => `<li>${r}</li>`).join("")}
              </ul>
            </div>
          </div>

          <div class="flex items-center gap-2 border-t border-[var(--border)] pt-3">
            ${stock.owned ? `
              <button type="button" class="flex-1 rounded-lg bg-[var(--primary)] px-3 py-2 text-xs font-semibold text-[var(--primary-foreground)]">+ Log trade</button>
              <button type="button" class="rounded-lg border border-[var(--border)] px-3 py-2 text-xs font-medium text-[var(--foreground)]">Fresh check</button>
            ` : `
              <button type="button" onclick="buyStock(event, '${stock.id}')" class="flex-1 rounded-lg bg-[var(--primary)] px-3 py-2 text-xs font-semibold text-[var(--primary-foreground)]">Buy &amp; move to Owned</button>
            `}
          </div>
        </aside>
      `;
    }

    function renderProposedRow(stock, isSelected) {
      const boxClass = "rounded-md border border-[var(--border)] bg-[var(--background)] px-2 py-1 text-xs tabular-nums";
      return `
        <div
          onclick="selectStock('${stock.id}')"
          class="cursor-pointer grid grid-cols-1 gap-2 px-3 py-2.5 transition sm:grid-cols-[minmax(190px,1.5fr)_84px_100px_118px_86px_76px] sm:items-center ${isSelected ? "bg-[var(--primary)]/10 ring-1 ring-inset ring-[var(--primary)]/40" : "hover:bg-[var(--content)]"}"
        >
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-md border border-[var(--border)] bg-[var(--background)] text-xs font-bold text-[var(--primary)]">${stock.symbol.slice(0, 2)}</span>
              <span class="truncate text-xs font-semibold text-[var(--foreground)]">${stock.name}</span>
              <span class="font-mono text-xs text-[var(--muted-foreground)]">${stock.symbol}</span>
            </div>
            <p class="mt-0.5 truncate pl-9 text-xs text-[var(--muted-foreground)]">${stock.summary}</p>
          </div>

          <div>
            <span class="${boxClass} inline-block font-medium text-[var(--foreground)]">${stock.price}</span>
          </div>

          <div>
            <span class="inline-block rounded-md border px-2 py-1 text-xs font-medium ${badgeStyle(stock.owned ? stock.thesisHealth : stock.verdict)}">
              ${stock.owned ? stock.thesisHealth : stock.verdict}
            </span>
          </div>

          <div>
            <span class="${boxClass} inline-block text-[var(--foreground)]">
              ${stock.owned ? `${stock.positionValue} · ${stock.shares}sh` : stock.buyRange}
            </span>
          </div>

          <div>
            <span class="${boxClass} inline-block font-semibold ${stock.owned ? (stock.gainPositive ? "text-[var(--success)]" : "text-[var(--error)]") : "text-[var(--muted-foreground)]"}">
              ${stock.owned ? stock.gainPct : stock.score}
            </span>
          </div>

          <div class="sm:text-right">
            ${stock.owned ? `
              <button type="button" onclick="event.stopPropagation(); selectStock('${stock.id}')" class="rounded-md border border-[var(--border)] bg-[var(--background)] px-2.5 py-1 text-xs font-medium text-[var(--foreground)] hover:border-[var(--primary)]">
                Details
              </button>
            ` : `
              <button type="button" onclick="buyStock(event, '${stock.id}')" class="rounded-md bg-[var(--primary)] px-2.5 py-1 text-xs font-semibold text-[var(--primary-foreground)] hover:opacity-90">
                Buy
              </button>
            `}
          </div>
        </div>
      `;
    }

    function renderProposed() {
      const q = state.search.trim().toLowerCase();
      const filtered = state.stocks.filter(s =>
        !q || s.name.toLowerCase().includes(q) || s.symbol.toLowerCase().includes(q) || s.summary.toLowerCase().includes(q)
      );
      const owned = filtered.filter(s => s.owned);
      const recs = filtered.filter(s => !s.owned);
      const hasSide = state.sideMode !== null;
      const selectedStock = state.stocks.find(s => s.id === state.selectedId) || state.stocks[0];

      return `
        <div class="space-y-4">
          <!-- Slim Header (No KPI Boxes!) -->
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div>
              <h2 class="text-lg font-bold text-[var(--foreground)]">Finance</h2>
              <p class="text-xs text-[var(--muted-foreground)]">Owned positions &amp; agent recommendations in one spreadsheet-style list.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <input
                type="search"
                value="${state.search}"
                oninput="state.search=this.value; render();"
                placeholder="Filter company or ticker..."
                class="rounded-lg border border-[var(--border)] bg-[var(--card)] px-3 py-1.5 text-xs text-[var(--foreground)] placeholder:text-[var(--placeholder)]"
              />
              <button
                type="button"
                onclick="toggleCriteria()"
                class="rounded-lg border ${state.sideMode === "criteria" ? "border-[var(--primary)] bg-[var(--primary)]/10 text-[var(--primary)]" : "border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]"} px-3 py-1.5 text-xs font-medium"
              >
                Criteria (2)
              </button>
              <button type="button" onclick="resetDemo()" class="rounded-lg border border-[var(--border)] bg-[var(--card)] px-2.5 py-1.5 text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)]">
                Reset demo
              </button>
            </div>
          </div>

          <!-- Split Screen: Left List + Right Side Panel -->
          <div class="grid grid-cols-1 items-start gap-4 lg:grid-cols-12">
            <section class="${hasSide ? "lg:col-span-7" : "lg:col-span-12"} overflow-hidden rounded-xl border border-[var(--card-border)] bg-[var(--card)]">
              <!-- Column Headers -->
              <div class="hidden border-b border-[var(--border)] bg-[var(--background)] px-3 py-2 text-xs font-semibold text-[var(--muted-foreground)] sm:grid sm:grid-cols-[minmax(190px,1.5fr)_84px_100px_118px_86px_76px]">
                <span>Company</span>
                <span>Price</span>
                <span>Status</span>
                <span>Value / Range</span>
                <span>Return / Score</span>
                <span class="text-right">Action</span>
              </div>

              <!-- Owned Group -->
              <div class="border-b border-[var(--border)] bg-[var(--content)] px-3 py-1.5 text-xs font-bold uppercase tracking-wider text-[var(--foreground)]">
                Owned (${owned.length})
              </div>
              <div class="divide-y divide-[var(--border)]">
                ${owned.map(s => renderProposedRow(s, state.sideMode === "company" && state.selectedId === s.id)).join("")}
              </div>

              <!-- Recommendations Group -->
              <div class="border-y border-[var(--border)] bg-[var(--content)] px-3 py-1.5 text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)]">
                Recommendations (${recs.length})
              </div>
              <div class="divide-y divide-[var(--border)]">
                ${recs.map(s => renderProposedRow(s, state.sideMode === "company" && state.selectedId === s.id)).join("")}
              </div>
            </section>

            ${hasSide ? `
              <div class="lg:col-span-5">
                ${state.sideMode === "criteria" ? renderCriteriaPanel() : renderCompanySidePanel(selectedStock)}
              </div>
            ` : ""}
          </div>
        </div>
      `;
    }

    function renderCurrent() {
      return `
        <div class="space-y-4">
          ${state.currentBanner ? `
            <div class="rounded-lg border border-[var(--warning)]/40 bg-[var(--warning)]/15 px-3 py-2 text-xs text-[var(--foreground)]">
              ${state.currentBanner}
            </div>
          ` : ""}

          <!-- Current Header -->
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div>
              <h2 class="text-lg font-bold text-[var(--foreground)]">Finance (Current Layout)</h2>
              <p class="text-xs text-[var(--muted-foreground)]">4 top KPI boxes + separate list + Criteria side rail + Portfolio card at bottom.</p>
            </div>
            <div class="flex items-center gap-2">
              <button type="button" onclick="toggleCriteria()" class="rounded-lg border border-[var(--border)] bg-[var(--card)] px-3 py-1.5 text-xs font-medium text-[var(--foreground)]">
                Criteria (2) ${state.currentCriteriaOpen ? "▴" : "▾"}
              </button>
              <button type="button" class="rounded-lg bg-[var(--primary)] px-3 py-1.5 text-xs font-semibold text-[var(--primary-foreground)]">
                + New criteria
              </button>
            </div>
          </div>

          <!-- 4 Top KPI Boxes (To Be Removed) -->
          <div class="relative rounded-xl border border-dashed border-[var(--error)]/50 p-2">
            <span class="mb-2 inline-block rounded bg-[var(--error)]/15 px-2 py-0.5 text-xs font-semibold text-[var(--error)]">
              To Remove: Top KPI Summary Boxes
            </span>
            <div class="grid grid-cols-2 gap-3 lg:grid-cols-4">
              <div class="rounded-lg border border-[var(--card-border)] bg-[var(--card)] p-3">
                <p class="text-xs text-[var(--muted-foreground)]">Portfolio value</p>
                <p class="mt-1 text-base font-bold text-[var(--foreground)]">$9,414</p>
              </div>
              <div class="rounded-lg border border-[var(--card-border)] bg-[var(--card)] p-3">
                <p class="text-xs text-[var(--muted-foreground)]">Needs your call</p>
                <p class="mt-1 text-base font-bold text-[var(--foreground)]">1 stock</p>
              </div>
              <div class="rounded-lg border border-[var(--card-border)] bg-[var(--card)] p-3">
                <p class="text-xs text-[var(--muted-foreground)]">Researched universe</p>
                <p class="mt-1 text-base font-bold text-[var(--foreground)]">5 companies</p>
              </div>
              <div class="rounded-lg border border-[var(--card-border)] bg-[var(--card)] p-3">
                <p class="text-xs text-[var(--muted-foreground)]">Active criteria</p>
                <p class="mt-1 text-base font-bold text-[var(--foreground)]">Quality at a fair price</p>
              </div>
            </div>
          </div>

          <!-- Current Main Workspace: List + Criteria Rail -->
          <div class="grid grid-cols-1 items-start gap-4 lg:grid-cols-12">
            <section class="${state.currentCriteriaOpen ? "lg:col-span-8" : "lg:col-span-12"} rounded-xl border border-[var(--card-border)] bg-[var(--card)] p-4 space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-[var(--foreground)]">Stock Research &amp; Analysis</h3>
                <span class="text-xs text-[var(--muted-foreground)]">Clicking a row opens /finance/[ticker]</span>
              </div>
              <div class="divide-y divide-[var(--border)]">
                ${state.stocks.map(s => `
                  <div onclick="selectStock('${s.id}')" class="cursor-pointer flex items-center justify-between gap-3 py-2.5 hover:bg-[var(--content)] px-2 rounded-lg">
                    <div class="min-w-0">
                      <div class="flex items-center gap-2">
                        <span class="text-xs font-semibold text-[var(--foreground)]">${s.name}</span>
                        <span class="font-mono text-xs text-[var(--muted-foreground)]">${s.symbol}</span>
                        <span class="rounded-full border px-2 py-0.5 text-xs ${badgeStyle(s.verdict)}">${s.verdict}</span>
                        ${s.owned ? `<span class="rounded-full border border-[var(--border)] px-2 py-0.5 text-xs text-[var(--muted-foreground)]">Held</span>` : ""}
                      </div>
                      <p class="mt-0.5 truncate text-xs text-[var(--muted-foreground)]">${s.summary}</p>
                    </div>
                    <span class="shrink-0 text-xs font-semibold text-[var(--primary)]">Open →</span>
                  </div>
                `).join("")}
              </div>
            </section>

            ${state.currentCriteriaOpen ? `<div class="lg:col-span-4">${renderCriteriaPanel()}</div>` : ""}
          </div>

          <!-- Current Bottom Portfolio Card (To Be Merged Into List) -->
          <div class="rounded-xl border border-dashed border-[var(--error)]/50 p-3">
            <span class="mb-2 inline-block rounded bg-[var(--error)]/15 px-2 py-0.5 text-xs font-semibold text-[var(--error)]">
              To Remove: Separate Bottom PortfolioCard (moves into Owned rows above)
            </span>
            <div class="rounded-lg border border-[var(--card-border)] bg-[var(--card)] p-3 flex flex-wrap items-center justify-between gap-3">
              <div class="text-xs">
                <p class="font-bold text-[var(--foreground)]">Portfolio (2 holdings)</p>
                <p class="text-[var(--muted-foreground)]">AAPL ($4,570 · +14.2%) · NVDA ($4,844 · +23.6%)</p>
              </div>
              <button type="button" class="rounded-lg bg-[var(--primary)] px-3 py-1.5 text-xs font-semibold text-[var(--primary-foreground)]">+ Log a trade</button>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      const tabProposed = document.getElementById("tab-proposed");
      const tabCurrent = document.getElementById("tab-current");
      if (state.mode === "proposed") {
        tabProposed.className = "rounded-md bg-[var(--primary)] px-3 py-1.5 text-xs font-semibold text-[var(--primary-foreground)]";
        tabCurrent.className = "rounded-md px-3 py-1.5 text-xs font-semibold text-[var(--muted-foreground)] hover:text-[var(--foreground)]";
        document.getElementById("stage").innerHTML = renderProposed();
      } else {
        tabCurrent.className = "rounded-md bg-[var(--primary)] px-3 py-1.5 text-xs font-semibold text-[var(--primary-foreground)]";
        tabProposed.className = "rounded-md px-3 py-1.5 text-xs font-semibold text-[var(--muted-foreground)] hover:text-[var(--foreground)]";
        document.getElementById("stage").innerHTML = renderCurrent();
      }
    }

    render();
  </script>
</body>
</html>
